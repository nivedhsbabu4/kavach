<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Radial and linear military gradients -->
    <radialGradient id="shieldBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#35532f"/>
      <stop offset="60%" stop-color="#243d20"/>
      <stop offset="100%" stop-color="#142412"/>
    </radialGradient>
    
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae084"/>
      <stop offset="50%" stop-color="#c2b280"/>
      <stop offset="100%" stop-color="#8a7337"/>
    </linearGradient>

    <linearGradient id="redCrossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background circular aura -->
  <circle cx="200" cy="200" r="190" fill="#1b2e18" stroke="url(#goldBorder)" stroke-width="3" opacity="0.4"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="#c2b280" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Military Shield Contour -->
  <g filter="url(#shadowFilter)">
    <!-- Outer Shield with Gold Accent -->
    <path d="M 200 45 
             C 285 45, 335 65, 340 135 
             C 345 235, 275 315, 200 355 
             C 125 315, 55 235, 60 135 
             C 65 65, 115 45, 200 45 Z" 
          fill="url(#shieldBg)" 
          stroke="url(#goldBorder)" 
          stroke-width="7" 
          stroke-linejoin="round"/>

    <!-- Inner Shield Inset Line -->
    <path d="M 200 58 
             C 275 58, 320 75, 325 138 
             C 330 225, 265 298, 200 338 
             C 135 298, 70 225, 75 138 
             C 80 75, 125 58, 200 58 Z" 
          fill="none" 
          stroke="#fae084" 
          stroke-width="1.8" 
          opacity="0.75"/>
  </g>

  <!-- Crossed Sabre / Laurel accents -->
  <path d="M 120 120 L 280 260 M 280 120 L 120 260" stroke="#c2b280" stroke-width="1.5" opacity="0.25"/>

  <!-- Iconic Armed Forces Medical Cross (Red) -->
  <g filter="url(#shadowFilter)">
    <!-- White backing shield for medical contrast -->
    <rect x="165" y="105" width="70" height="150" rx="8" fill="#ffffff" stroke="#c2b280" stroke-width="2"/>
    <rect x="125" y="145" width="150" height="70" rx="8" fill="#ffffff" stroke="#c2b280" stroke-width="2"/>

    <!-- Primary Red Cross Core -->
    <rect x="172" y="112" width="56" height="136" rx="5" fill="url(#redCrossGrad)"/>
    <rect x="132" y="152" width="136" height="56" rx="5" fill="url(#redCrossGrad)"/>
    
    <!-- Central protective golden star/dot -->
    <circle cx="200" cy="180" r="10" fill="#fae084" stroke="#8a7337" stroke-width="1.5"/>
  </g>

  <!-- National Tri-Color Accent Ribbon underneath -->
  <g opacity="0.95">
    <!-- Saffron stripe -->
    <path d="M 140 285 Q 200 300 260 285" stroke="#FF9933" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- White stripe -->
    <path d="M 145 292 Q 200 306 255 292" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Green stripe -->
    <path d="M 150 298 Q 200 312 250 298" stroke="#138808" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Typography: KAVACH -->
  <text x="200" y="338" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="28" 
        letter-spacing="5" 
        fill="#fae084" 
        stroke="#142412" 
        stroke-width="1"
        style="text-transform: uppercase;">
    KAVACH
  </text>
</svg>
