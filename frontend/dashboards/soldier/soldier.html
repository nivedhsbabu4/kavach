<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAVACH — Soldier &amp; Veteran Sovereign Health Console (React Powered)</title>
  <link rel="stylesheet" href="../../shared/shared.css" />
  <link rel="stylesheet" href="soldier.css" />
  <link rel="icon" href="../../assets/logo.svg" />
  
  <!-- Modern React 18, ReactDOM, Babel & Tailwind CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            mil: {
              950: '#08110a',
              900: '#0e1e12',
              800: '#1b3823',
              700: '#254d31',
              600: '#306340',
              500: '#3f7e53',
              100: '#e8f3ec',
              50: '#f3f8f5'
            },
            brass: {
              500: '#b89341',
              400: '#cfaa5e',
              100: '#fbf5ea'
            }
          }
        }
      }
    };
  </script>

  <script src="../../shared/auth_guard.js"></script>
  <script>enforceRoleGuard('SOLDIER');</script>
</head>
<body data-theme="light">

  <!-- React Application Mounting Root -->
  <div id="root"></div>

  <!-- React 18 Application Script -->
  <script type="text/babel" src="soldier.js"></script>
</body>
</html>
